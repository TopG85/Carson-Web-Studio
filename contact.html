<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Carson Web Studio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Barlow:wght@600&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col bg-white font-sans text-base" style="color:#1e3a8a;">
    <header>
        <nav class="bg-white text-blue-900 shadow-lg">
            <div class="max-w-6xl mx-auto px-4 flex items-center justify-between"
                style="padding-top:2.5rem;padding-bottom:2.5rem;">
                <h1 class="text-7xl font-extrabold tracking-tight nunito-header">Carson Web Studio</h1>
                <ul class="flex space-x-6 font-barlow text-lg">
                    <li><a href="index.html" class="cws-nav-link">Home</a></li>
                    <li class="relative group">
                        <a href="projects.html" class="cws-nav-link">Projects</a>
                        <ul
                            class="absolute left-0 mt-2 w-56 bg-white rounded shadow-lg opacity-0 group-hover:opacity-100 transition pointer-events-none group-hover:pointer-events-auto z-20">
                            <li><a href="projects/vinelife.html"
                                    class="block px-4 py-2 hover:bg-purple-800 hover:text-white">Vinelife Church</a>
                            </li>
                            <li><a href="projects/bitesizechurch.html"
                                    class="block px-4 py-2 hover:bg-purple-800 hover:text-white">Bitesize Church</a>
                            </li>
                        </ul>
                    </li>
                    <li><a href="about.html" class="cws-nav-link">About</a></li>
                    <li><a href="contact.html" class="cws-nav-link">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <section class="relative flex-1 flex flex-col justify-center items-center py-16 px-4">
        <main class="w-full max-w-xl mx-auto text-center">
            <h1 class="text-4xl font-bold nunito-header" style="color:#581c87;">Contact</h1>
            <p class="text-lg mt-3 mb-8" style="color:#1e3a8a;">
                Have a project in mind? Fill out the form below, or email me directly at
                <a href="mailto:danielcarson1985@gmail.com" class="underline font-semibold"
                    style="color:#581c87;">danielcarson1985@gmail.com</a>.
            </p>

            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="flex flex-col space-y-4 text-left">
                <div>
                    <label for="name" class="block text-sm font-semibold mb-1" style="color:#1e3a8a;">Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2"
                        style="focus:ring-color:#581c87;" />
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold mb-1" style="color:#1e3a8a;">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2" />
                </div>

                <div>
                    <label for="message" class="block text-sm font-semibold mb-1" style="color:#1e3a8a;">Message</label>
                    <textarea id="message" name="message" rows="5" required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2"></textarea>
                </div>

                <button type="submit"
                    class="mt-2 px-6 py-3 rounded-lg font-semibold text-white nunito-header transition hover:opacity-90"
                    style="background-color:#581c87;">
                    Send Message
                </button>
            </form>
        </main>
    </section>

</body>

</html>
