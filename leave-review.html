<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review | Carson Web Studio</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col bg-white font-sans text-base text-blue-900">
    <header>
        <nav class="bg-white text-blue-900 shadow-lg">
            <div class="max-w-6xl mx-auto px-4 flex items-center justify-between"
                style="padding-top:1.5rem;padding-bottom:1.5rem;">
                <h1 class="text-4xl sm:text-7xl font-extrabold tracking-tight nunito-header">Carson Web Studio</h1>

                <button type="button" class="nav-burger" aria-label="Toggle menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>

                <ul class="nav-links flex space-x-6 font-barlow text-lg">
                    <li><a href="/Carson-Web-Studio/index.html" class="cws-nav-link">Home</a></li>
                    <li class="relative nav-dropdown">
                        <div class="flex items-center gap-1">
                            <a href="/Carson-Web-Studio/projects.html" class="cws-nav-link">Projects</a>
                            <button type="button" class="nav-dropdown-trigger" aria-label="Toggle Projects submenu" aria-expanded="false">▾</button>
                        </div>
                        <ul class="nav-dropdown-menu absolute left-0 w-56 bg-white rounded shadow-lg z-20">
                            <li><a href="/Carson-Web-Studio/projects/carbcounter.html" class="block px-4 py-2 hover:bg-purple-800 hover:text-white">Carb Counter App</a></li>
                            <li><a href="/Carson-Web-Studio/projects/vinelife.html" class="block px-4 py-2 hover:bg-purple-800 hover:text-white">Vinelife Church</a></li>
                            <li><a href="/Carson-Web-Studio/projects/bitesizechurch.html" class="block px-4 py-2 hover:bg-purple-800 hover:text-white">Bitesize Church</a></li>
                            <li><a href="/Carson-Web-Studio/projects/shutterspace.html" class="block px-4 py-2 hover:bg-purple-800 hover:text-white">ShutterSpace</a></li>
                            <li><a href="/Carson-Web-Studio/projects/hackathon.html" class="block px-4 py-2 hover:bg-purple-800 hover:text-white">Hackathon Projects</a></li>
                        </ul>
                    </li>
                    <li><a href="/Carson-Web-Studio/about.html" class="cws-nav-link">About</a></li>
                    <li><a href="/Carson-Web-Studio/contact.html" class="cws-nav-link">Contact</a></li>
                    <li><a href="/Carson-Web-Studio/leave-review.html" class="cws-nav-link">Leave a Review</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="flex-1 w-full px-4 py-10">
        <section class="max-w-2xl mx-auto text-center py-10">
            <h1 class="text-4xl font-bold nunito-header text-purple-800 mb-4">Leave a Review</h1>
            <p class="text-lg mb-10" id="form-intro">
                Worked with me on a project? I'd love to hear how it went. 
            </p>

            <form id="review-form" class="flex flex-col space-y-6 text-left">

                <div>
                    <label class="block text-sm font-semibold mb-2">Your rating</label>
                    <div class="star-picker" id="star-picker" role="radiogroup" aria-label="Star rating">
                        <span class="star-picker-star" data-value="1">★</span>
                        <span class="star-picker-star" data-value="2">★</span>
                        <span class="star-picker-star" data-value="3">★</span>
                        <span class="star-picker-star" data-value="4">★</span>
                        <span class="star-picker-star" data-value="5">★</span>
                    </div>
                    <input type="hidden" name="rating" id="rating-value" value="" required>
                </div>

                <div>
                    <label for="name" class="block text-sm font-semibold mb-1">Your name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2">
                </div>

                <div>
                    <label for="project" class="block text-sm font-semibold mb-1">Which project?</label>
                    <input type="text" id="project" name="project" placeholder="e.g. Vinelife Church Wilmslow"
                        class="w-full rounded-lg border border-gray-300 px-4 py-2">
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold mb-1">Your email (not published)</label>
                    <input type="email" id="email" name="email" required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2">
                </div>

                <div>
                    <label for="comment" class="block text-sm font-semibold mb-1">Your review</label>
                    <textarea id="comment" name="comment" rows="5" required
                        class="w-full rounded-lg border border-gray-300 px-4 py-2"></textarea>
                </div>

                <button type="submit" class="cws-btn" id="submit-btn">Submit Review</button>
            </form>
        </section>
    </main>

    <script src="js/nav.js"></script>

    <!-- Firebase (modular SDK via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDq9Q8UbnAXgvQeSGd-hc9J2uOfqkSwJmk",
            authDomain: "carson-web-studio-reviews.firebaseapp.com",
            projectId: "carson-web-studio-reviews",
            storageBucket: "carson-web-studio-reviews.firebasestorage.app",
            messagingSenderId: "173684844543",
            appId: "1:173684844543:web:d53ca6ae630787688da9ca"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- Star picker (click to set rating) ---
        const stars = document.querySelectorAll('#star-picker .star-picker-star');
        const ratingInput = document.getElementById('rating-value');

        function applyFill(value) {
            stars.forEach(function (s) {
                s.classList.toggle('selected', Number(s.getAttribute('data-value')) <= Number(value));
            });
        }

        stars.forEach(function (star) {
            star.addEventListener('click', function () {
                ratingInput.value = star.getAttribute('data-value');
                applyFill(ratingInput.value);
            });
            star.addEventListener('mouseenter', function () {
                applyFill(star.getAttribute('data-value'));
            });
        });
        document.getElementById('star-picker').addEventListener('mouseleave', function () {
            applyFill(ratingInput.value);
        });

        // --- Form submission straight to Firestore ---
        const form = document.getElementById('review-form');
        const submitBtn = document.getElementById('submit-btn');
        const intro = document.getElementById('form-intro');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!ratingInput.value) {
                alert('Please choose a star rating before submitting.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                await addDoc(collection(db, 'reviews'), {
                    name: document.getElementById('name').value,
                    project: document.getElementById('project').value,
                    email: document.getElementById('email').value,
                    comment: document.getElementById('comment').value,
                    rating: Number(ratingInput.value),
                    approved: false,
                    createdAt: serverTimestamp()
                });

                form.style.display = 'none';
                intro.textContent = "Thank you! Your review has been submitted and will appear on the site once it's been checked.";
            } catch (err) {
                console.error('Failed to submit review:', err);
                alert('Sorry, something went wrong submitting your review. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Review';
            }
        });
    </script>
</body>

</html>
